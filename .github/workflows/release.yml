# v로 시작하는 태그를 올리면 앱을 빌드해서 GitHub Release에 zip으로 첨부
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: VERSION="$GITHUB_REF_NAME" zsh build.sh

      - name: Zip app
        run: ditto -c -k --keepParent ClaudeUsageBar.app "ClaudeUsageBar-$GITHUB_REF_NAME.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ClaudeUsageBar-$GITHUB_REF_NAME.zip" --title "$GITHUB_REF_NAME" --generate-notes
